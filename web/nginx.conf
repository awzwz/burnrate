# nginx for the Burn Rate single-page app (image: nginxinc/nginx-unprivileged, uid 101, port 8080).
# Everything nginx writes goes to /tmp, so the container runs with a read-only root filesystem
# (the pod mounts an emptyDir at /tmp).

worker_processes 2;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    log_format json escape=json
        '{"time":"$time_iso8601","method":"$request_method","uri":"$request_uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,"request_id":"$http_x_request_id",'
        '"forwarded_for":"$http_x_forwarded_for","user_agent":"$http_user_agent"}';
    access_log /dev/stdout json;

    sendfile           on;
    tcp_nopush         on;
    server_tokens      off;
    keepalive_timeout  65s;
    # this server only ever answers GET/HEAD for small static files
    client_max_body_size 64k;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_types        text/css application/javascript application/json image/svg+xml text/plain
                      application/manifest+json application/xml;

    # Cache policy by path. Sent on successful answers only (no `always` below): a 404 for an asset that a
    # not-yet-updated pod does not have during a rollout must never be cached for a year.
    map $uri $br_cache_control {
        default                                        "no-cache";                              # index.html, every app route
        ~^/assets/                                     "public, max-age=31536000, immutable";   # content-hashed by Vite
        ~*\.(?:svg|png|jpe?g|webp|avif|ico|woff2?)$    "public, max-age=86400";                 # unhashed files from web/public
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # behind the gateway: redirects must stay relative (the client sees https on :443, not http on :8080)
        absolute_redirect off;
        port_in_redirect  off;

        # All headers are set here and in no location block: an `add_header` inside a location would drop
        # every header inherited from this level.
        add_header Cache-Control $br_cache_control;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
        # CONTENT SECURITY POLICY. The app loads only its own scripts and calls only its own origin.
        # If the front end starts using an external font, script or API host, add it HERE or the browser blocks it.
        # ('unsafe-inline' for styles: React writes style="" attributes.)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        # Strict-Transport-Security is added by the gateway (the place that terminates TLS), for the API too.

        # liveness/readiness for the pod
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Back-end paths are never this server's business. In the cluster the gateway routes /api and /hooks to
        # the back end and answers 404 itself for the rest; if such a request still lands here it must get a
        # 404, not index.html with status 200.
        location ~ ^/(?:api|hooks|internal|metrics|readyz|admin/api)(?:/|$) {
            default_type application/json;
            return 404 '{"error":{"code":"not_found","message":"No such endpoint."}}';
        }

        # content-hashed build output: a missing file is a real 404, never the app shell
        location /assets/ {
            try_files $uri =404;
        }

        # no dotfiles (/.well-known/ stays available for files the app may put in web/public later)
        location ~ /\.(?!well-known/) {
            return 404;
        }

        # the app: a real file if there is one, otherwise index.html (client-side routing)
        location / {
            try_files $uri /index.html;
        }
    }
}
