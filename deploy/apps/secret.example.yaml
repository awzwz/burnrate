# SHAPE of the Secret every Burn Rate pod reads (envFrom). An example with placeholders: do NOT fill it in and
# do NOT apply it. The real one is built and applied by
#
#   deploy/scripts/secrets.sh            # generates what can be generated, takes the rest from your environment
#
# Generated values are kept in deploy/secrets/ (gitignored, chmod 600) so a re-run does not change them.
apiVersion: v1
kind: Secret
metadata:
  name: burnrate-secrets
  namespace: burnrate
type: Opaque
stringData:
  # --- generated by secrets.sh (deploy/secrets/app.env) ---
  BR_JWT_SECRET: "<64 hex characters>"        # signs session tokens; rotating it signs everybody out
  BR_INTERNAL_TOKEN: "<40 hex characters>"    # service-to-service calls (x-internal-token)
  BR_ADMIN_TOKEN: "<40 hex characters>"       # backoffice (x-admin-token), reached by port-forward only

  # --- built by secrets.sh from the PostgreSQL password in deploy/secrets/pg.env ---
  # {service} stays literally in the value: the application replaces it with the service name, dashes turned
  # into underscores (burnrate/common/db.py). One database per service: deploy/platform/cnpg/databases.yaml.
  BR_DATABASE_URL: "postgresql+asyncpg://burnrate:<password>@pg-rw.data.svc.cluster.local:5432/{service}"

  # --- taken from the environment of the person who runs secrets.sh (or from .env in the repository root) ---
  BR_OPENAI_API_KEY: "<sk-...>"               # required while BR_LLM_PROVIDER=openai
  # optional; a key is written only when the variable is set
  BR_ANTHROPIC_API_KEY: "<sk-ant-...>"        # for BR_LLM_PROVIDER=anthropic
  BR_STRIPE_SECRET_KEY: "<sk_test_...>"       # for BR_BILLING_PROVIDER=stripe
  BR_STRIPE_WEBHOOK_SECRET: "<whsec_...>"
  BR_TWILIO_ACCOUNT_SID: "<AC...>"            # for BR_SMS_PROVIDER=twilio
  BR_TWILIO_AUTH_TOKEN: "<...>"
  BR_TWILIO_FROM: "<+1...>"
  BR_SMTP_URL: "<smtp://user:password@host:587>"   # for BR_EMAIL_PROVIDER=smtp
