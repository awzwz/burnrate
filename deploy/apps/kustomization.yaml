# Burn Rate application: `kubectl kustomize deploy/apps` renders the DEFAULT profile (small).
#
#   deploy/apps/small    3 nodes of 4 vCPU / 8 GB: edge-api, web and engine twice, everything else once
#   deploy/apps/full     after the account limit is raised: two or more of everything
#
#   kubectl kustomize deploy/apps            # = deploy/apps/small
#   kubectl kustomize deploy/apps/full
#   deploy/scripts/deploy.sh                 # PROFILE=small|full: schema job, apply, wait for the rollouts
#
# Layout
#   common/   written by hand, the same in both profiles: ConfigMap, HTTPRoute, NetworkPolicy, monitoring
#   small/    GENERATED by deploy/scripts/gen-apps.sh from burnrate/services/__init__.py
#   full/     GENERATED, same shape
#   env/      what belongs to one deployment: public hostname, image tags (written by deploy.sh)
#   jobs/     the schema Job, created by deploy.sh before each rollout (GENERATED)
# The Secret burnrate-secrets is created by deploy/scripts/secrets.sh and is never in git
# (its shape: secret.example.yaml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - small
