# KEDA ScaledObject on Kafka consumer lag for every worker: consumer group = worker name,
# one trigger per topic, +1 replica per 50 messages of lag, 2..6 replicas.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge-api
  labels:
    app.kubernetes.io/name: edge-api
    app.kubernetes.io/component: service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge-api
  minReplicas: 3
  maxReplicas: 8
  metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
