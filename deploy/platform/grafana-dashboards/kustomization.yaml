# Grafana dashboards as ConfigMaps. The Grafana sidecar picks up every ConfigMap labelled grafana_dashboard=1
# in any namespace and shows it in the folder named by the annotation grafana_folder.
#   kubectl apply -k deploy/platform/grafana-dashboards        (bootstrap.sh, step observability)
# To add a dashboard: export its JSON from Grafana into this directory and list the file below.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Burn Rate
configMapGenerator:
  - name: dashboard-burnrate-overview
    files:
      - burnrate-overview.json
