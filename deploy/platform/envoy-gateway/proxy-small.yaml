# Envoy proxies of the Gateway, profile "small": 2 replicas (one per node) behind the DigitalOcean Load Balancer.
# Referenced by GatewayClass "envoy" (gateway-small.yaml). The controller creates the Deployment and the
# LoadBalancer Service in envoy-gateway-system; their pods carry the labels
#   gateway.envoyproxy.io/owning-gateway-name=burnrate, gateway.envoyproxy.io/owning-gateway-namespace=edge
# which the application's NetworkPolicy uses to let the gateway in.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: burnrate
  namespace: envoy-gateway-system
spec:
  logging:
    level:
      default: warn
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
        pod:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: ScheduleAnyway
              labelSelector:
                matchLabels:
                  gateway.envoyproxy.io/owning-gateway-name: burnrate
                  gateway.envoyproxy.io/owning-gateway-namespace: edge
      envoyPDB:
        minAvailable: 1
      envoyService:
        type: LoadBalancer
        # "Cluster", as on the previous cluster: every node accepts load balancer traffic.
        externalTrafficPolicy: Cluster
        annotations:
          service.beta.kubernetes.io/do-loadbalancer-name: burnrate-lb
          service.beta.kubernetes.io/do-loadbalancer-size-unit: "1"
          # HARDENING, not enabled because it has not been tried on a cluster: let only the Caddy droplet
          # reach the load balancer. Without it anyone who knows the load balancer address can talk to the
          # application over plain HTTP and invent an X-Forwarded-For header. Enable, re-apply this file,
          # then run deploy/scripts/smoke.sh; if the site stops answering, remove the line again.
          # service.beta.kubernetes.io/do-loadbalancer-allow-rules: "ip:67.207.94.96"
