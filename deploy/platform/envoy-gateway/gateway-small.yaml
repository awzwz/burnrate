# The entry of the cluster, profile "small" (Gateway API, implemented by Envoy Gateway).
#
#   browser --HTTPS--> Caddy on droplet burnrate-app (67.207.94.96, certificate for burnrate.67.207.94.96.sslip.io)
#           --HTTP, Host header unchanged--> DigitalOcean Load Balancer "burnrate-lb" :80 --> Envoy proxies --> HTTPRoute
#
# TLS ends at Caddy, outside the cluster. So this Gateway has ONE listener, plain HTTP on port 80, and there is
# NO redirect to HTTPS here: Caddy already redirects browsers, and a redirect on this side would send Caddy's
# own requests in a circle. No certificate, no cert-manager in this profile.
# The listener accepts any Host; the application's HTTPRoute (deploy/apps/common/routes.yaml) answers only
# for burnrate.67.207.94.96.sslip.io, every other name gets a 404 from Envoy.
#
# Know what this means: the hop Caddy -> load balancer is NOT encrypted, and the load balancer's port 80 is
# reachable by anyone who learns its address (see "Known limits" in deploy/README.md and the allow rule in
# proxy-small.yaml).
#
# The Envoy proxies themselves (replicas, resources, load balancer): proxy-small.yaml.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: burnrate
    namespace: envoy-gateway-system
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: burnrate
  namespace: edge
spec:
  gatewayClassName: envoy
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              burnrate.io/gateway-routes: "true"
