# Namespaces of the Burn Rate cluster.
#   burnrate       application services, workers, jobs. Meshed by Linkerd (annotation below); its HTTPRoutes
#                  may attach to the public Gateway (label below).
#   edge           the public Gateway, its TLS certificate and the HTTP -> HTTPS redirect
#   data           PostgreSQL, Kafka, Valkey. Never exposed outside; ingress is default-deny
#                  (deploy/platform/network-policies/data.yaml)
#   platform       operators: Strimzi, CloudNativePG, KEDA (+ Vault in the `full` profile)
#   observability  Prometheus, Alertmanager, Grafana (+ Loki, Tempo, Alloy in the `full` profile)
# Created by their Helm releases: envoy-gateway-system, cert-manager, linkerd, argocd (`full`).
apiVersion: v1
kind: Namespace
metadata:
  name: burnrate
  labels:
    app.kubernetes.io/part-of: burnrate
    burnrate.io/gateway-routes: "true"
  annotations:
    linkerd.io/inject: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: edge
  labels:
    app.kubernetes.io/part-of: burnrate
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
  labels:
    app.kubernetes.io/part-of: burnrate
---
apiVersion: v1
kind: Namespace
metadata:
  name: platform
  labels:
    app.kubernetes.io/part-of: burnrate
---
apiVersion: v1
kind: Namespace
metadata:
  name: observability
  labels:
    app.kubernetes.io/part-of: burnrate
