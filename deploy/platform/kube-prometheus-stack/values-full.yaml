# kube-prometheus-stack, profile "full": a week of metrics, Loki and Tempo as data sources.
prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 16GB
    # Tempo's metrics generator writes span metrics and the service graph here
    enableRemoteWriteReceiver: true
    enableFeatures:
      - exemplar-storage
    resources:
      requests: {cpu: 200m, memory: 1536Mi}
      limits: {memory: 3Gi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
grafana:
  resources:
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 768Mi}
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki.observability:3100
      jsonData:
        maxLines: 1000
    - name: Tempo
      type: tempo
      uid: tempo
      access: proxy
      url: http://tempo.observability:3200
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
          spanStartTimeShift: "-5m"
          spanEndTimeShift: "5m"
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
