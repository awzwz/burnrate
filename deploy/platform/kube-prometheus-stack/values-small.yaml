# kube-prometheus-stack, profile "small": one day of metrics on a 5 GiB volume, small requests.
# No Loki / Tempo in this profile: logs are `kubectl logs`, there are no traces.
prometheus:
  prometheusSpec:
    retention: 1d
    retentionSize: 4GB
    resources:
      requests: {cpu: 100m, memory: 512Mi}
      limits: {memory: 1280Mi}
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: do-block-storage
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi
grafana:
  resources:
    # the previous cluster measured about 490 Mi in use after start (Grafana 13 plus its sidecars)
    requests: {cpu: 50m, memory: 384Mi}
    limits: {memory: 768Mi}
