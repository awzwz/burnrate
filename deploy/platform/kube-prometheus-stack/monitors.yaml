# Scrape targets outside the application namespace. Applied by bootstrap.sh (step observability), after the
# Prometheus Operator CRDs exist. The application's own PodMonitor and alert rules: deploy/apps/common/monitoring.yaml.

# Kafka consumer lag and topic offsets from the Strimzi Kafka Exporter:
# kafka_consumergroup_lag{consumergroup=<worker>, topic, partition}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-exporter
  namespace: data
spec:
  selector:
    matchLabels:
      strimzi.io/name: burnrate-kafka-exporter
  podMetricsEndpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 30s
---
# PostgreSQL (CloudNativePG instance exporter): cnpg_* metrics
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: postgres
  namespace: data
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: pg
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
---
# Envoy proxies of the public Gateway: what the outside world actually got (envoy_http_downstream_rq_xx, ...)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: envoy-gateway-proxies
  namespace: envoy-gateway-system
spec:
  selector:
    matchLabels:
      gateway.envoyproxy.io/owning-gateway-name: burnrate
  podMetricsEndpoints:
    - port: metrics
      path: /stats/prometheus
      interval: 30s
