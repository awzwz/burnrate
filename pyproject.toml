[project]
name = "burnrate"
version = "0.1.0"
description = "Burn Rate: card-interest planning platform (microservices, one image, role set by SERVICE)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "httpx>=0.27",
  "pyjwt>=2.9",
  "python-multipart>=0.0.9",
  "aiokafka>=0.11",
  "redis>=5.0",
  "prometheus-client>=0.20",
  "openai>=1.50",
  "anthropic>=0.40",
  "pypdf>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: browser tests against a running stack"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form fields as default arguments; these calls are evaluated once by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Header", "fastapi.Body"]

[tool.setuptools.packages.find]
include = ["burnrate*"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"
